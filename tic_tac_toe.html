<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permainan Tic Tac Toe</title>
    <!-- Memuatkan Tailwind CSS untuk gaya -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuatkan font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Latar belakang slate-900 */
            color: #f8fafc;
        }
        .cell {
            transition: all 0.2s ease-in-out;
        }
        .cell:hover:not(.occupied) {
            background-color: #1e293b;
            cursor: pointer;
            transform: scale(1.05);
        }
        .occupied {
            cursor: not-allowed;
        }
        .x-mark {
            color: #38bdf8; /* Biru muda untuk X */
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .o-mark {
            color: #f43f5e; /* Merah jambu untuk O */
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .winning-cell {
            background-color: rgba(34, 197, 94, 0.2) !important;
            border-color: #22c55e !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 to-slate-800 p-4">
    
    <div class="max-w-md w-full bg-slate-800/50 backdrop-blur-md border border-slate-700 rounded-3xl p-6 shadow-2xl">
        
        <!-- Tajuk Permainan -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-pink-500">
                Tic Tac Toe
            </h1>
            <p class="text-slate-400 font-medium">Buktikan kehebatan strategi anda!</p>
        </div>

        <!-- Papan Markah -->
        <div class="flex justify-between items-center bg-slate-900/50 rounded-2xl p-4 mb-6 border border-slate-700/50">
            <div class="text-center flex-1">
                <p class="text-sm text-slate-400 font-semibold mb-1">Pemain X</p>
                <p class="text-3xl font-bold text-sky-400" id="scoreX">0</p>
            </div>
            <div class="w-px h-12 bg-slate-700 mx-4"></div>
            <div class="text-center flex-1">
                <p class="text-sm text-slate-400 font-semibold mb-1">Seri</p>
                <p class="text-3xl font-bold text-slate-300" id="scoreTie">0</p>
            </div>
            <div class="w-px h-12 bg-slate-700 mx-4"></div>
            <div class="text-center flex-1">
                <p class="text-sm text-slate-400 font-semibold mb-1">Pemain O</p>
                <p class="text-3xl font-bold text-rose-400" id="scoreO">0</p>
            </div>
        </div>

        <!-- Status Permainan -->
        <div class="text-center mb-6">
            <div id="statusIndicator" class="inline-block px-6 py-2 rounded-full bg-slate-700 text-lg font-semibold shadow-inner transition-colors duration-300">
                Giliran: <span id="currentPlayerDisplay" class="text-sky-400">Pemain X</span>
            </div>
        </div>

        <!-- Papan Permainan (Grid 3x3) -->
        <div id="board" class="grid grid-cols-3 gap-3 mb-8">
            <!-- Sel akan dijana menggunakan JavaScript, tetapi struktur statik disediakan untuk keselamatan -->
            <div class="cell h-24 sm:h-28 bg-slate-700/50 rounded-xl border border-slate-600 flex items-center justify-center text-6xl font-bold" data-index="0"></div>
            <div class="cell h-24 sm:h-28 bg-slate-700/50 rounded-xl border border-slate-600 flex items-center justify-center text-6xl font-bold" data-index="1"></div>
            <div class="cell h-24 sm:h-28 bg-slate-700/50 rounded-xl border border-slate-600 flex items-center justify-center text-6xl font-bold" data-index="2"></div>
            
            <div class="cell h-24 sm:h-28 bg-slate-700/50 rounded-xl border border-slate-600 flex items-center justify-center text-6xl font-bold" data-index="3"></div>
            <div class="cell h-24 sm:h-28 bg-slate-700/50 rounded-xl border border-slate-600 flex items-center justify-center text-6xl font-bold" data-index="4"></div>
            <div class="cell h-24 sm:h-28 bg-slate-700/50 rounded-xl border border-slate-600 flex items-center justify-center text-6xl font-bold" data-index="5"></div>
            
            <div class="cell h-24 sm:h-28 bg-slate-700/50 rounded-xl border border-slate-600 flex items-center justify-center text-6xl font-bold" data-index="6"></div>
            <div class="cell h-24 sm:h-28 bg-slate-700/50 rounded-xl border border-slate-600 flex items-center justify-center text-6xl font-bold" data-index="7"></div>
            <div class="cell h-24 sm:h-28 bg-slate-700/50 rounded-xl border border-slate-600 flex items-center justify-center text-6xl font-bold" data-index="8"></div>
        </div>

        <!-- Butang Main Semula -->
        <button id="restartBtn" class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
            </svg>
            Main Semula
        </button>
    </div>

    <script>
        // Pembolehubah dan Keadaan (State) Permainan
        const cells = document.querySelectorAll('.cell');
        const statusIndicator = document.getElementById('statusIndicator');
        const currentPlayerDisplay = document.getElementById('currentPlayerDisplay');
        const restartBtn = document.getElementById('restartBtn');
        const scoreXElement = document.getElementById('scoreX');
        const scoreOElement = document.getElementById('scoreO');
        const scoreTieElement = document.getElementById('scoreTie');

        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let scores = { X: 0, O: 0, Tie: 0 };

        // Kombinasi untuk menang
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Baris
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Lajur
            [0, 4, 8], [2, 4, 6]             // Pepenjuru
        ];

        // Tambah Event Listener untuk setiap sel
        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        // Butang Main Semula
        restartBtn.addEventListener('click', restartGame);

        // Fungsi untuk menguruskan klik pada sel
        function handleCellClick(e) {
            const clickedCell = e.target;
            // Pastikan kita mendapat indeks yang betul jika pengguna klik dalam sel
            const cellIndex = parseInt(clickedCell.getAttribute('data-index'));

            // Abaikan klik jika sel sudah diisi atau permainan telah tamat
            if (board[cellIndex] !== '' || !gameActive) {
                return;
            }

            // Kemas kini papan
            board[cellIndex] = currentPlayer;
            
            // Kemas kini UI
            clickedCell.innerText = currentPlayer;
            clickedCell.classList.add('occupied');
            
            if (currentPlayer === 'X') {
                clickedCell.classList.add('x-mark');
            } else {
                clickedCell.classList.add('o-mark');
            }

            // Semak jika ada pemenang selepas gerakan ini
            checkResult();
        }

        // Fungsi untuk menyemak kemenangan atau seri
        function checkResult() {
            let roundWon = false;
            let winningCells = [];

            // Periksa semua kemungkinan menang
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    winningCells = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                handleWin(winningCells);
                return;
            }

            // Periksa jika seri (tiada ruang kosong)
            let roundDraw = !board.includes('');
            if (roundDraw) {
                handleDraw();
                return;
            }

            // Tukar giliran pemain
            changePlayer();
        }

        // Fungsi untuk menguruskan kemenangan
        function handleWin(winningCells) {
            gameActive = false;
            scores[currentPlayer]++;
            updateScoreBoard();
            
            // Serlahkan sel yang menang
            winningCells.forEach(index => {
                cells[index].classList.add('winning-cell');
            });

            // Kemas kini status
            statusIndicator.classList.replace('bg-slate-700', 'bg-green-600/90');
            statusIndicator.innerHTML = `🎉 <span class="font-bold text-white">Pemain ${currentPlayer} Menang!</span> 🎉`;
        }

        // Fungsi untuk menguruskan seri
        function handleDraw() {
            gameActive = false;
            scores.Tie++;
            updateScoreBoard();

            statusIndicator.classList.replace('bg-slate-700', 'bg-yellow-600/90');
            statusIndicator.innerHTML = `🤝 <span class="font-bold text-white">Permainan Seri!</span> 🤝`;
        }

        // Tukar pemain dari X ke O dan sebaliknya
        function changePlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            
            // Kemas kini teks dan warna giliran
            if (currentPlayer === 'X') {
                currentPlayerDisplay.innerText = 'Pemain X';
                currentPlayerDisplay.className = 'text-sky-400';
            } else {
                currentPlayerDisplay.innerText = 'Pemain O';
                currentPlayerDisplay.className = 'text-rose-400';
            }
        }

        // Kemas kini teks papan markah
        function updateScoreBoard() {
            scoreXElement.innerText = scores.X;
            scoreOElement.innerText = scores.O;
            scoreTieElement.innerText = scores.Tie;
        }

        // Set semula permainan untuk pusingan baharu
        function restartGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            currentPlayer = 'X';

            // Bersihkan keadaan status
            statusIndicator.className = 'inline-block px-6 py-2 rounded-full bg-slate-700 text-lg font-semibold shadow-inner transition-colors duration-300';
            statusIndicator.innerHTML = `Giliran: <span id="currentPlayerDisplay" class="text-sky-400">Pemain X</span>`;
            
            // Kami perlu merujuk semula ke elemen ini kerana HTML diganti di baris atas
            // jika permainan tamat.
            const newDisplayElement = document.getElementById('currentPlayerDisplay');
            if (newDisplayElement) {
                currentPlayerDisplay = newDisplayElement;
            }

            // Bersihkan gaya dari grid
            cells.forEach(cell => {
                cell.innerText = '';
                cell.className = 'cell h-24 sm:h-28 bg-slate-700/50 rounded-xl border border-slate-600 flex items-center justify-center text-6xl font-bold';
            });
        }
    </script>
</body>
</html>
